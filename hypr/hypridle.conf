general {
    ignore_wayland_inhibit = false
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

listener {
    timeout = 60
    on-timeout = ~/.config/hypr/scripts/display-control dim
    on-resume = ~/.config/hypr/scripts/display-control on
}

listener {
    timeout = 90
    on-timeout = loginctl lock-session
}

listener {
    timeout = 600
    on-timeout = ~/.config/hypr/scripts/display-control off
    on-resume = ~/.config/hypr/scripts/display-control on
}
