# USER BACKGROUND
shape {
    monitor = DP-3

    size = 125, 48
    color = rgba(0, 144, 144, 1)
    rounding = 0

    position = 100, 100
    halign = left
    valign = bottom

    zindex = 0
}

# PASSWORD BACKGROUND
shape {
    monitor = DP-3

    size = 200, 48
    color = rgba(0, 144, 144, 0.5)
    rounding = 0

    position = 225, 100
    halign = left
    valign = bottom

    zindex = 0
}

# USER
label {
    monitor = DP-3

    text = $USER
    color = rgba(225, 225, 225, 0.9)
    font_size = 24
    font_family = JetBrainsMono Nerd Font

    position = 108, 103
    halign = left
    valign = bottom

    zindex = 2
}

# USER -> PASSWORD SEPARATOR
label {
    monitor = DP-3

    text = 
    color = rgba(0, 144, 144, 1)
    font_size = 27
    font_family = JetBrainsMono Nerd Font

    position = 225, 100
    halign = left
    valign = bottom

    zindex = 2
}

# PASSWORD
input-field {
    monitor = DP-3

    size = 180, 48

    outline_thickness = 0
    inner_color = rgba(0, 0, 0, 0)
    outer_color = rgba(0, 0, 0, 0)

    dots_size = 0.4
    dots_spacing = 0.2
    dots_center = true
    dots_text_format = *

    placeholder_text = <span foreground="##909090" size="22000">password</span>

    font_family = JetBrainsMono Nerd Font

    font_color = rgba(225, 225, 225, 0.9)
    fade_on_empty = false
    rounding = 0
    hide_input = false

    position = 245, 100
    halign = left
    valign = bottom

    zindex = 2
}

# PASSWORD RIGHT SEPARATOR
label {
    monitor = DP-3

    text = 
    color = rgba(0, 144, 144, 0.5)
    font_size = 27
    font_family = JetBrainsMono Nerd Font

    position = 425, 100
    halign = left
    valign = bottom

    zindex = 2
}

# --------------------------------------------------------------------------------------------------------------------------

# TIME
label {
    monitor = DP-3
    text = cmd[update:1000] echo "$(date +"%H:%M:%S")"

    color = rgba(225, 225, 225, 0.8)
    font_size = 72
    font_family = JetBrainsMono Nerd Font

    halign = left
    valign = top
    position = 100, -90
}

# DATE
label {
    monitor = DP-3
    text = cmd[update:1000] echo "$(date +"%A, %B %d")"

    color = rgba(225, 225, 225, 0.8)
    font_size = 24
    font_family = JetBrainsMono Nerd Font

    halign = left
    valign = top
    position = 104, -190
}
