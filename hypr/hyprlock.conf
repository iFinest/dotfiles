# BACKGROUND
background {
    monitor = DP-3
    path = /home/finest/Pictures/Wallpapers/peakpx.jpg
    blur_passes = 2
    contrast = 1
    brightness = 0.4
    vibrancy = 0.17
    vibrancy_darkness = 0.5
}

# GENERAL
general {
    no_fade_in = false
    no_fade_out = false
    hide_cursor = true
    grace = 0
    disable_loading_bar = false
}

