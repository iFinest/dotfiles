# Directories
music_directory    "/mnt/satassd/Music"
playlist_directory "~/.config/mpd/playlists"
db_file            "~/.config/mpd/database"
log_file           "~/.config/mpd/log"
pid_file           "~/.config/mpd/pid"
state_file         "~/.config/mpd/state"

# Network
bind_to_address    "127.0.0.1"
port               "6600"
auto_update        "yes"

# Normal Audio Output
audio_output {
    type            "pipewire"
    name            "PipeWire Sound Server"
}

# The Visualizer Feed (Crucial for the btop look!)
audio_output {
    type           "fifo"
    name           "Visualizer Feed"
    path           "/tmp/mpd.fifo"
    format         "44100:16:2"
}

