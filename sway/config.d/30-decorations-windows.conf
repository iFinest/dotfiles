### Decoration/window config
# Focus follows mouse
focus_follows_mouse yes

# font
font pango:Iosevka 12

# titlebar
client.focused          #4fd6ae #203f3a #ffffff #4fd6ae #202020
client.unfocused        #505050 #181818 #888888 #505050 #181818
client.focused_inactive #505050 #222222 #aaaaaa #505050 #222222
client.urgent           #ff6500 #222222 #ffffff #ff6500 #222222
titlebar_padding 4 2
titlebar_border_thickness 1

# Window borders
default_border pixel 0

# Gaps
gaps inner 0
gaps outer 0
