### Startup commands
# X11 compatibility
exec xhost +SI:localuser:root
exec xrandr --output DP-1 --primary
# XDG autostart
exec dex -a ~/.config/autostart/
# env
exec dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP=sway

### config refresh commands
# waybar
exec_always "pkill -x -SIGUSR2 waybar || waybar -c ~/.config/waybar/config.jsonc"
